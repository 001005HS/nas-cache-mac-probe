name: ncm
# nas-cache-mac: 손님 워크플로처럼 캐시 단계 없이 공개 패키지를 받는다. 두 번 돌려 2회차가 NAS 적중인지 잰다.
on: workflow_dispatch
jobs:
  mac:
    runs-on: xenoci-macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: dev wrappers
        # 운영 콘솔이 맥을 준비하므로(dev RENTAL_DRIVER=remote) dev 의 새 래퍼(c6649ac1e, 9f4b4a4dd)를 운영 배포 뒤 모습대로 얹는다.
        run: |
          . ~/.xeno-ci/artifact-env.sh
          cp ncm-tools/*.sh "$XENO_ARTIFACT_TOOL_ROOT/" && chmod 755 "$XENO_ARTIFACT_TOOL_ROOT"/artifact-client-{gitdeps,pod,curl}.sh
          ln -sfn "$XENO_ARTIFACT_TOOL_ROOT/artifact-client-gitdeps.sh" "$XENO_ARTIFACT_TOOL_ROOT/bin/swift"
          ln -sfn "$XENO_ARTIFACT_TOOL_ROOT/artifact-client-gitdeps.sh" "$XENO_ARTIFACT_TOOL_ROOT/bin/xcodebuild"
          for t in pod swift xcodebuild curl npm; do echo "$t -> $(command -v $t)"; done
          echo "XENO_ARTIFACT_GIT_TRACE=1" >> "$GITHUB_ENV"
      - name: pod install
        run: |
          mkdir -p /tmp/p && cd /tmp/p && cat > Podfile <<'EOF'
          platform :ios, '15.0'
          install! 'cocoapods', integrate_targets: false
          target 'X' do
            pod 'Nuke', '12.8.0'
            pod 'PromiseKit', '8.1.2'
          end
          EOF
          time pod install 2>&1 | tail -3
      - name: spm resolve
        run: |
          mkdir -p /tmp/s/Sources/S && cd /tmp/s && echo 'public let x = 1' > Sources/S/s.swift
          cat > Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "S", dependencies: [.package(url: "https://github.com/apple/swift-system", exact: "1.4.0"), .package(url: "https://github.com/apple/swift-atomics", exact: "1.2.0")], targets: [.target(name: "S", dependencies: [.product(name: "SystemPackage", package: "swift-system"), .product(name: "Atomics", package: "swift-atomics")])])
          EOF
          time swift package resolve 2>&1 | tail -3
      - name: npm install
        run: |
          mkdir -p /tmp/n && cd /tmp/n && echo '{"name":"x","version":"1.0.0"}' > package.json
          time npm install --no-audit --no-fund nanoid@5.0.9 ms@2.1.3 2>&1 | tail -2
      - name: brew
        run: time brew fetch --force-bottle watch 2>&1 | tail -2
      - name: gem
        run: time gem install --user-install --no-document tty-color -v 0.6.0 2>&1 | tail -2
      - name: release
        run: curl -fsSL -o /tmp/f.zip https://github.com/realm/SwiftLint/releases/download/0.56.2/portable_swiftlint.zip && ls -la /tmp/f.zip

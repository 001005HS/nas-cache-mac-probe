name: pkg
on: workflow_dispatch
jobs:
  mac:
    runs-on: xenoci-macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm
        run: |
          mkdir -p /tmp/n && cd /tmp/n && echo '{"name":"x","version":"1.0.0"}' > package.json
          XENO_ARTIFACT_NPM_TRACE=1 npm install --no-audit --no-fund lodash@4.17.21 left-pad@1.3.0 2>&1 | tail -3
      - name: brew
        run: XENO_ARTIFACT_BREW_TRACE=1 brew fetch --force-bottle jq 2>&1 | tail -3 || true
      - name: gem
        run: gem install --user-install --no-document rake -v 13.2.1 2>&1 | tail -2 || true
      - name: pod
        run: |
          mkdir -p /tmp/p && cd /tmp/p && cat > Podfile <<'EOF'
          platform :ios, '15.0'
          install! 'cocoapods', integrate_targets: false
          target 'X' do
            pod 'Alamofire', '5.9.1'
          end
          EOF
          pod install 2>&1 | tail -4 || true
      - name: swiftpm
        run: |
          mkdir -p /tmp/s/Sources/S && cd /tmp/s && echo 'public let x = 1' > Sources/S/s.swift
          cat > Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "S", dependencies: [.package(url: "https://github.com/apple/swift-argument-parser", exact: "1.3.0")], targets: [.target(name: "S", dependencies: [.product(name: "ArgumentParser", package: "swift-argument-parser")])])
          EOF
          time swift package resolve 2>&1 | tail -3 || true
      - name: release
        run: curl -fsSL -o /tmp/r.zip https://github.com/realm/SwiftLint/releases/download/0.57.0/portable_swiftlint.zip && ls -la /tmp/r.zip || true
